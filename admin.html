<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ets MNS Services - Administration</title>
    <link rel="icon" href="logo.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F4C430">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #F4C430; --gold-light: #FFE066; --gold-bright: #FFD700; --gold-dark: #C68E17;
            --gold-line: rgba(244,196,48,0.35); --gold-soft: rgba(244,196,48,0.12);
            --black: #08060a; --dark: #100c07; --dark-2: #18120a; --dark-3: #241c0f;
            --white: #fffaf0; --gray: #9a8f78; --gray-light: #d8cba8;
            --green: #2ecc71; --red: #e74c3c;
            --sheen: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.015) 22%, transparent 45%);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse 85% 55% at 50% -12%, rgba(244,196,48,0.16), transparent 60%),
                        radial-gradient(ellipse 95% 60% at 50% 112%, rgba(244,196,48,0.12), transparent 60%),
                        linear-gradient(180deg, #0c0a06 0%, #060503 50%, #0c0a06 100%);
            background-attachment: fixed; color: var(--white); min-height: 100vh; line-height: 1.6;
        }
        ::-webkit-scrollbar { width: 9px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold-light), var(--gold), var(--gold-dark)); border-radius: 4px; }
        .hidden { display: none !important; }

        /* Banner Notification Temps Réel */
        .notification-banner {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            background: linear-gradient(135deg, #1e1b14, #2a2418);
            border: 1px solid var(--gold); border-left: 5px solid var(--gold-bright);
            padding: 16px 20px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(244,196,48,0.2);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(.7,0,.2,1);
            max-width: 350px; display: flex; align-items: center; gap: 12px;
        }
        .notification-banner.show { transform: translateX(0); }
        .notif-icon { color: var(--gold-light); font-size: 1.5rem; }
        .notif-content h4 { margin: 0 0 4px 0; font-size: 0.95rem; color: var(--white); }
        .notif-content p { margin: 0; font-size: 0.8rem; color: var(--gray-light); }

        /* Login View */
        #login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 20px; }
        .login-card {
            width: 100%; max-width: 420px; background: var(--sheen), var(--dark-2);
            border: 1px solid var(--gold-line); border-radius: 22px; padding: 45px 38px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 50px rgba(244,196,48,0.12); text-align: center;
        }
        .login-logo { width: 90px; height: 90px; border-radius: 50%; background: var(--white); padding: 8px; margin: 0 auto 22px; box-shadow: 0 0 30px rgba(244,196,48,0.6); }
        .login-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .login-card h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; }
        .login-card h1 .ets { color: var(--gold-light); font-style: italic; }
        .login-subtitle { font-size: 0.85rem; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .login-field { text-align: left; margin-bottom: 18px; }
        .login-field label { display: block; font-size: 0.82rem; color: var(--gray-light); margin-bottom: 8px; font-weight: 500; }
        .login-field label i { color: var(--gold-light); margin-right: 6px; }
        .login-input {
            width: 100%; padding: 14px 16px; background: var(--dark); border: 1px solid rgba(244,196,48,0.2);
            border-radius: 11px; color: var(--white); font-size: 0.95rem; font-family: 'Poppins', sans-serif; transition: all 0.3s;
        }
        .login-input:focus { outline: none; border-color: var(--gold-light); box-shadow: 0 0 0 4px rgba(244,196,48,0.22); }
        .login-btn {
            width: 100%; padding: 15px; margin-top: 8px;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-dark));
            color: var(--black); border: none; border-radius: 11px; font-size: 1rem; font-weight: 700; cursor: pointer;
            font-family: 'Poppins', sans-serif; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.3s; box-shadow: 0 8px 26px rgba(244,196,48,0.5);
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(255,215,0,0.7); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .login-error { display: none; margin-top: 18px; padding: 12px 14px; background: rgba(231,76,60,0.12); border: 1px solid rgba(231,76,60,0.4); border-radius: 10px; color: #ffb4ab; font-size: 0.85rem; }

        /* Dashboard Header */
        .admin-header {
            position: sticky; top: 0; z-index: 50; background: rgba(8,6,10,0.92); backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--gold-line); padding: 16px 30px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        }
        .admin-brand { display: flex; align-items: center; gap: 14px; }
        .admin-brand-logo { width: 44px; height: 44px; border-radius: 50%; background: var(--white); padding: 4px; box-shadow: 0 0 18px rgba(244,196,48,0.6); }
        .admin-brand-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .admin-brand-text h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 600; }
        .admin-brand-text h2 .ets { color: var(--gold-light); font-style: italic; }
        .admin-brand-text span { font-size: 0.72rem; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; }
        .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .admin-btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; border: 1px solid var(--gold-line); background: var(--gold-soft); color: var(--gold-light); font-family: 'Poppins', sans-serif; transition: all 0.3s;
        }
        .admin-btn:hover { border-color: var(--gold); background: rgba(244,196,48,0.2); }
        .admin-btn.danger { border-color: rgba(231,76,60,0.4); color: #ffb4ab; background: rgba(231,76,60,0.1); }
        .admin-btn.danger:hover { border-color: var(--red); background: rgba(231,76,60,0.2); }

        .admin-container { max-width: 1100px; margin: 0 auto; padding: 30px 24px 0; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 26px; }
        .stat-card { background: var(--sheen), var(--dark-2); border: 1px solid var(--gold-line); border-radius: 16px; padding: 22px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 8px 26px rgba(0,0,0,0.4); }
        .stat-icon { width: 50px; height: 50px; border-radius: 13px; flex-shrink: 0; background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark)); display: flex; align-items: center; justify-content: center; color: var(--black); font-size: 1.3rem; box-shadow: 0 4px 14px rgba(244,196,48,0.5); }
        .stat-value { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 700; color: var(--white); line-height: 1; }
        .stat-label { font-size: 0.78rem; color: var(--gray); letter-spacing: 0.5px; margin-top: 4px; }

        /* Prix Panel */
        .prix-panel { background: var(--sheen), var(--dark-2); border: 1px solid var(--gold-line); border-radius: 16px; padding: 22px 24px; margin-bottom: 26px; }
        .prix-panel h3 { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--gold-light); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .prix-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 0.82rem; }
        .prix-name { width: 130px; color: var(--gray-light); flex-shrink: 0; }
        .prix-bar-bg { flex: 1; height: 9px; background: var(--dark-3); border-radius: 6px; overflow: hidden; }
        .prix-bar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light)); transition: width 0.6s ease; }
        .prix-count { width: 34px; text-align: right; color: var(--gold-light); font-weight: 600; flex-shrink: 0; }

        /* Toolbar */
        .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
        .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-tab { padding: 9px 16px; border-radius: 30px; font-size: 0.82rem; font-weight: 500; cursor: pointer; border: 1px solid var(--gold-line); background: transparent; color: var(--gray-light); font-family: 'Poppins', sans-serif; transition: all 0.3s; }
        .filter-tab:hover { border-color: var(--gold); color: var(--gold-light); }
        .filter-tab.active { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: var(--black); font-weight: 700; border-color: var(--gold-bright); }
        .search-box { position: relative; margin-left: auto; min-width: 220px; flex: 1; max-width: 320px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 0.85rem; }
        .search-box input { width: 100%; padding: 11px 14px 11px 38px; background: var(--dark); border: 1px solid rgba(244,196,48,0.2); border-radius: 30px; color: var(--white); font-size: 0.85rem; font-family: 'Poppins', sans-serif; }
        .search-box input:focus { outline: none; border-color: var(--gold-light); }

        /* Avis List */
        .avis-list { display: flex; flex-direction: column; gap: 18px; }
        .avis-card { background: var(--sheen), var(--dark-2); border: 1px solid var(--gold-line); border-left: 4px solid var(--gold); border-radius: 16px; padding: 24px 26px; box-shadow: 0 8px 26px rgba(0,0,0,0.4); transition: border-color 0.3s; }
        .avis-card.unread { border-left-color: var(--gold-bright); box-shadow: 0 8px 26px rgba(0,0,0,0.4), 0 0 22px rgba(255,215,0,0.12); }
        .avis-card:hover { border-color: var(--gold); }
        .avis-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
        .avis-who { display: flex; align-items: center; gap: 12px; }
        .avis-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--gold-light), var(--gold-dark)); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-weight: 700; color: var(--black); font-size: 1.1rem; }
        .avis-name { font-weight: 600; color: var(--white); font-size: 1rem; }
        .avis-date { font-size: 0.74rem; color: var(--gray); }
        .avis-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
        .badge-unread { background: rgba(255,215,0,0.16); color: var(--gold-bright); border: 1px solid rgba(255,215,0,0.4); }
        .badge-read { background: rgba(46,204,113,0.14); color: #7ee2a8; border: 1px solid rgba(46,204,113,0.4); }
        .badge-rep { background: rgba(244,196,48,0.16); color: var(--gold-light); border: 1px solid var(--gold-line); }
        .badge-price { background: var(--gold-soft); color: var(--gold-light); border: 1px solid var(--gold-line); text-transform: none; }

        .avis-notes { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 16px; padding: 14px 16px; background: var(--dark); border-radius: 12px; }
        .note-item { display: flex; flex-direction: column; gap: 4px; }
        .note-label { font-size: 0.72rem; color: var(--gray); letter-spacing: 0.5px; }
        .note-stars { font-size: 0.95rem; display: flex; gap: 2px; }
        .note-stars i.full { color: var(--gold-bright); text-shadow: 0 0 8px rgba(255,215,0,0.5); }
        .note-stars i.empty { color: var(--dark-3); }
        .note-avg { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold-light); }
        .note-avg small { font-size: 0.7rem; color: var(--gray); font-family: 'Poppins', sans-serif; font-weight: 400; }

        .avis-text { margin-bottom: 14px; }
        .avis-text .lbl { font-size: 0.72rem; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .avis-text .val { color: var(--gray-light); font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; }
        .avis-text.sugg .val { color: var(--gray); font-style: italic; }

        .avis-response { margin-top: 6px; padding-top: 16px; border-top: 1px dashed var(--gold-line); }
        .avis-response .lbl { font-size: 0.72rem; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .reponse-input { width: 100%; min-height: 70px; padding: 12px 14px; resize: vertical; background: var(--dark); border: 1px solid rgba(244,196,48,0.2); border-radius: 10px; color: var(--white); font-size: 0.9rem; font-family: 'Poppins', sans-serif; }
        .reponse-input:focus { outline: none; border-color: var(--gold-light); box-shadow: 0 0 0 3px rgba(244,196,48,0.18); }
        .reponse-meta { font-size: 0.72rem; color: var(--gray); margin-top: 6px; }
        .avis-foot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
        .foot-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; font-family: 'Poppins', sans-serif; transition: all 0.25s; }
        .foot-btn.save { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: var(--black); }
        .foot-btn.save:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(244,196,48,0.5); }
        .foot-btn.read { background: var(--gold-soft); color: var(--gold-light); border: 1px solid var(--gold-line); }
        .foot-btn.read:hover { border-color: var(--gold); }
        .foot-btn.del { background: rgba(231,76,60,0.12); color: #ffb4ab; border: 1px solid rgba(231,76,60,0.35); }
        .foot-btn.del:hover { background: rgba(231,76,60,0.22); border-color: var(--red); }
        .foot-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
        .empty-state i { font-size: 3rem; color: var(--gold-dark); opacity: 0.5; margin-bottom: 16px; }
        .empty-state h3 { font-family: 'Playfair Display', serif; color: var(--gray-light); font-size: 1.3rem; margin-bottom: 8px; }
        .empty-state p { font-size: 0.88rem; max-width: 460px; margin: 0 auto; line-height: 1.6; }
        
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark-2); border: 1px solid var(--gold); color: var(--gold-light); padding: 12px 22px; border-radius: 30px; font-size: 0.85rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.6); opacity: 0; visibility: hidden; transition: all 0.35s ease; z-index: 200; display: flex; align-items: center; gap: 10px; }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: var(--red); color: #ffb4ab; }

        @media (max-width: 600px) {
            .admin-header { padding: 14px 18px; }
            .admin-container { padding: 22px 16px 0; }
            .avis-card { padding: 20px 18px; }
            .avis-notes { gap: 14px; }
            .search-box { margin-left: 0; max-width: none; }
            .prix-name { width: 90px; font-size: 0.74rem; }
        }
    </style>
</head>
<body>

    <!-- Banner Notification Flottant -->
    <div class="notification-banner" id="realtimeBanner">
        <i class="fas fa-bell notif-icon"></i>
        <div class="notif-content">
            <h4>Nouvel Avis Reçu !</h4>
            <p id="bannerText">Un client vient de laisser un commentaire.</p>
        </div>
    </div>

    <!-- Ecran de Connexion -->
    <div id="login-view">
        <div class="login-card">
            <div class="login-logo">
                <img src="logo.png" alt="MNS" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="login-logo-fallback" style="display:none;">MNS</div>
            </div>
            <h1><span class="ets">Ets</span> MNS Services</h1>
            <div class="login-subtitle">Espace administration</div>
            <form id="loginForm" autocomplete="off">
                <div class="login-field">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Adresse e-mail</label>
                    <input type="email" id="loginEmail" class="login-input" placeholder="admin@mnsservices.com" required>
                </div>
                <div class="login-field">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Mot de passe</label>
                    <input type="password" id="loginPassword" class="login-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-right-to-bracket"></i> Se connecter
                </button>
                <div class="login-error" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- Tableau de Bord -->
    <div id="dashboard-view" class="hidden">
        <header class="admin-header">
            <div class="admin-brand">
                <div class="admin-brand-logo"><img src="logo.png" alt="MNS"></div>
                <div class="admin-brand-text">
                    <h2><span class="ets">Ets</span> MNS Services</h2>
                    <span>Tableau de bord · Temps Réel</span>
                </div>
            </div>
            <div class="admin-actions">
                <button class="admin-btn" id="refreshBtn"><i class="fas fa-rotate"></i> Actualiser</button>
                <button class="admin-btn danger" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Déconnexion</button>
            </div>
        </header>
        <div class="admin-container">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="prix-panel">
                <h3><i class="fas fa-tags"></i> Répartition des avis sur les prix</h3>
                <div id="prixBars"></div>
            </div>
            <div class="toolbar">
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab active" data-filter="all">Tous</button>
                    <button class="filter-tab" data-filter="unread">Non lus</button>
                    <button class="filter-tab" data-filter="unanswered">Non répondus</button>
                    <button class="filter-tab" data-filter="answered">Répondus</button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher un nom ou un contenu...">
                </div>
            </div>
            <div class="avis-list" id="avisList"></div>
            <div class="empty-state hidden" id="emptyState">
                <i class="fas fa-inbox"></i>
                <h3>Aucun avis à afficher</h3>
                <p id="emptyMsg">Aucun avis ne correspond actuellement à ce filtre.</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        // --- CONFIG SUPABASE ---
        const SUPABASE_URL = 'https://fntsytwnfgncgqcavcrw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZudHN5dHduZmduY2dxY2F2Y3J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDYwMjAsImV4cCI6MjEwNjAyMjAyMH0.G1CoACooVmfRiNUyjcP3bfRXLW7d-BN2KkNcWHpK3a4';

            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) { console.error("Erreur init Supabase", e); }

        // --- ETAT GLOBAL ---
        let allAvis = [];
        let currentFilter = 'all';
        let searchTerm = '';
        let drafts = {};
        let channelSubscription = null;

        // --- DOM ELEMENTS ---
        const loginView = document.getElementById('login-view');
        const dashView = document.getElementById('dashboard-view');
        const banner = document.getElementById('realtimeBanner');
        const bannerText = document.getElementById('bannerText');
        const statsGrid = document.getElementById('statsGrid');
        const prixBars = document.getElementById('prixBars');
        const avisList = document.getElementById('avisList');
        const emptyState = document.getElementById('emptyState');
        const emptyMsg = document.getElementById('emptyMsg');
        const searchInput = document.getElementById('searchInput');
        const filterTabs = document.getElementById('filterTabs');
        const toastEl = document.getElementById('toast');
        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        // --- UTILITAIRES ---
        function escapeHtml(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function formatDate(iso) { 
            if(!iso) return ''; 
            const d = new Date(iso); 
            return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); 
        }
        function initials(name) { 
            if (!name || name === 'Anonyme') return '?'; 
            const p = name.trim().split(/\s+/); 
            return (p[0][0]||'').toUpperCase()+(p[1]?p[1][0].toUpperCase():''); 
        }
        function starsHtml(n) { 
            let s=''; for(let i=1;i<=5;i++) s+=`<i class="fas fa-star ${i<=(parseInt(n)||0)?'full':'empty'}"></i>`; return s; 
        }
        let toastTimer = null;
        function toast(msg, isError) {
            toastEl.textContent = msg;
            toastEl.className = 'toast show' + (isError ? ' error' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.className = 'toast', 3200);
        }

        // --- NOTIFICATIONS SYSTEM ---
        async function requestNotifPermission() {
            if (!("Notification" in window)) return;
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                showSystemNotification("Notifications activées !", "Vous recevrez désormais les alertes en temps réel.");
            }
        }

        function showSystemNotification(title, body) {
            if (Notification.permission !== "granted") return;
            const isVisible = document.visibilityState === 'visible';
            
            if (isVisible) {
                showInternalBanner(body);
                playSound();
            } else {
                new Notification(title, {
                    body: body,
                    icon: '/logo.png',
                    badge: '/logo.png',
                    tag: 'mns-new-avis'
                });
            }
        }

        function showInternalBanner(msg) {
            bannerText.textContent = msg;
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 5000);
        }

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        // --- REALTIME LISTENER ---
        function subscribeToRealtime() {
            if (!supabase) return;
            if (channelSubscription) supabase.removeChannel(channelSubscription);

            channelSubscription = supabase
                .channel('avis-channel')
                .on('postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'avis' }, 
                    (payload) => {
                        console.log('🔔 Nouvel avis reçu:', payload.new);
                        allAvis.unshift(payload.new);
                        
                        const nom = payload.new.nom || 'Anonyme';
                        const note = payload.new.moyenne ? `${payload.new.moyenne}/5` : 'Note non donnée';
                        showSystemNotification(
                            "Nouvel Avis MNS Services", 
                            `${nom} a laissé un avis (${note}). Consultez-le maintenant.`
                        );
                        
                        if (!dashView.classList.contains('hidden')) renderAll();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') console.log('✅ Connected to Realtime Channel');
                });
        }

        // --- LOGIQUE AUTH & RENDERING ---
        function showLogin() { dashView.classList.add('hidden'); loginView.classList.remove('hidden'); }
        function showDashboard() { loginView.classList.add('hidden'); dashView.classList.remove('hidden'); }

        async function loadAvis() {
            try {
                const res = await supabase.from('avis').select('*').order('date_creation', { ascending: false });
                if (res.error) throw res.error;
                allAvis = res.data || [];
                drafts = {};
                renderAll();
            } catch (err) {
                console.error('Erreur chargement avis :', err);
                allAvis = [];
                renderAll();
                toast('Impossible de charger les avis.', true);
            }
        }

        function renderAll() {
            renderStats();
            renderPrix();
            renderList();
        }

        function renderStats() {
            const total = allAvis.length;
            const notes = allAvis.map(a => parseFloat(a.moyenne)).filter(n => !isNaN(n));
            const avg = notes.length ? (notes.reduce((x,y)=>x+y,0)/notes.length) : 0;
            const unread = allAvis.filter(a => !a.lu).length;
            const answered = allAvis.filter(a => a.reponse && String(a.reponse).trim() !== '').length;

            statsGrid.innerHTML = 
                card('fa-comments', total, 'Avis enregistrés', '') +
                card('fa-star-half-stroke', avg ? avg.toFixed(1) : '-', 'Note moyenne / 5', '') +
                card('fa-envelope-open-text', unread, 'Non lus', unread > 0 ? 'red' : 'green') +
                card('fa-reply', answered, 'Répondus', '');

            function card(icon, val, label, color) {
                return `<div class="stat-card"><div class="stat-icon ${color}"><i class="fas ${icon}"></i></div><div><div class="stat-value">${escapeHtml(String(val))}</div><div class="stat-label">${escapeHtml(label)}</div></div></div>`;
            }
        }

        function renderPrix() {
            const order = ['Très abordable', 'Abordable', 'Correct', 'Un peu cher', 'Trop cher', 'Non précisé'];
            const counts = {};
            order.forEach(k => counts[k] = 0);
            allAvis.forEach(a => {
                const k = a.avis_prix || 'Non précisé';
                if (counts[k] === undefined) { counts[k] = 0; order.push(k); }
                counts[k]++;
            });
            const max = Math.max(1, ...Object.values(counts));

            let html = '';
            order.forEach(k => {
                const c = counts[k] || 0;
                const w = Math.round((c / max) * 100);
                html += `<div class="prix-row"><span class="prix-name">${escapeHtml(k)}</span><span class="prix-bar-bg"><span class="prix-bar" style="width:${w}%"></span></span><span class="prix-count">${c}</span></div>`;
            });
            prixBars.innerHTML = html;
        }

        function getFiltered() {
            const t = searchTerm.toLowerCase();
            return allAvis.filter(a => {
                if (currentFilter === 'unread' && a.lu) return false;
                if (currentFilter === 'answered' && !(a.reponse && String(a.reponse).trim() !== '')) return false;
                if (currentFilter === 'unanswered' && (a.reponse && String(a.reponse).trim() !== '')) return false;
                if (t) {
                    const hay = ((a.nom || '') + ' ' + (a.commentaire || '') + ' ' + (a.suggestions || '') + ' ' + (a.reponse || '')).toLowerCase();
                    if (hay.indexOf(t) === -1) return false;
                }
                return true;
            });
        }

        function renderList() {
            const list = getFiltered();
            if (list.length === 0) {
                avisList.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyMsg.textContent = allAvis.length === 0 ? "Aucun avis n'a encore été enregistré." : "Aucun avis ne correspond à ce filtre.";
                return;
            }
            emptyState.classList.add('hidden');
            let html = '';
            list.forEach(a => html += cardHtml(a));
            avisList.innerHTML = html;

            list.forEach(a => {
                const ta = avisList.querySelector(`.avis-card[data-id="${a.id}"] .reponse-input`);
                if (ta) ta.value = drafts[a.id] !== undefined ? drafts[a.id] : (a.reponse || '');
            });
        }

        function cardHtml(a) {
            const isRead = !!a.lu;
            const hasRep = !!(a.reponse && String(a.reponse).trim() !== '');
            const avg = a.moyenne !== null && a.moyenne !== undefined ? parseFloat(a.moyenne) : null;

            let badges = '';
            badges += isRead ? '<span class="badge badge-read"><i class="fas fa-check"></i> Lu</span>' : '<span class="badge badge-unread"><i class="fas fa-circle"></i> Non lu</span>';
            if (hasRep) badges += '<span class="badge badge-rep"><i class="fas fa-reply"></i> Répondu</span>';
            if (a.avis_prix) badges += `<span class="badge badge-price"><i class="fas fa-tag"></i> ${escapeHtml(a.avis_prix)}</span>`;

            const sugg = (a.suggestions && String(a.suggestions).trim() !== '') ? `<div class="avis-text sugg"><div class="lbl"><i class="fas fa-lightbulb"></i> Suggestions</div><div class="val">${escapeHtml(a.suggestions)}</div></div>` : '';
            const repMeta = hasRep && a.repondu_le ? `<div class="reponse-meta"><i class="fas fa-clock"></i> Répondu le ${escapeHtml(formatDate(a.repondu_le))}</div>` : '';

            return `<article class="avis-card ${isRead ? '' : 'unread'}" data-id="${escapeHtml(a.id)}">
                <div class="avis-top">
                    <div class="avis-who">
                        <div class="avis-avatar">${escapeHtml(initials(a.nom))}</div>
                        <div><div class="avis-name">${escapeHtml(a.nom || 'Anonyme')}</div><div class="avis-date"><i class="far fa-calendar"></i> ${escapeHtml(formatDate(a.date_creation))}</div></div>
                    </div>
                    <div class="avis-badges">${badges}</div>
                </div>
                <div class="avis-notes">
                    ${noteBlock('Accueil', a.note_accueil)}
                    ${noteBlock('Nourriture', a.note_nourriture)}
                    ${noteBlock('Quantité', a.note_quantite)}
                    <div class="note-item"><span class="note-label">Moyenne</span><span class="note-avg">${avg !== null && !isNaN(avg) ? avg.toFixed(1) : '-'}<small> / 5</small></span></div>
                </div>
                <div class="avis-text"><div class="lbl"><i class="fas fa-comment"></i> Commentaire</div><div class="val">${escapeHtml(a.commentaire) || '<em style="color:var(--gray)">Aucun commentaire</em>'}</div></div>
                ${sugg}
                <div class="avis-response">
                    <div class="lbl"><i class="fas fa-pen-to-square"></i> Réponse de l'administration</div>
                    <textarea class="reponse-input" placeholder="Rédigez une réponse..."></textarea>
                    ${repMeta}
                </div>
                <div class="avis-foot">
                    <button class="foot-btn save" data-action="save"><i class="fas fa-paper-plane"></i> Enregistrer la réponse</button>
                    ${!isRead ? '<button class="foot-btn read" data-action="read"><i class="fas fa-check"></i> Marquer comme lu</button>' : ''}
                    <button class="foot-btn del" data-action="delete"><i class="fas fa-trash"></i> Supprimer</button>
                </div>
            </article>`;

            function noteBlock(label, val) {
                return `<div class="note-item"><span class="note-label">${label}</span><span class="note-stars">${starsHtml(val)}</span></div>`;
            }
        }

        // Actions Delegated
        avisList.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const card = btn.closest('.avis-card');
            if (!card) return;
            const id = card.dataset.id;
            const action = btn.dataset.action;
            const avis = allAvis.find(a => a.id === id);
            if (!avis) return;

            if (action === 'read') {
                btn.disabled = true;
                const r = await supabase.from('avis').update({ lu: true }).eq('id', id);
                if (r.error) { toast('Erreur : ' + r.error.message, true); btn.disabled = false; return; }
                avis.lu = true; delete drafts[id]; renderAll(); toast('Avis marqué comme lu.');
            } else if (action === 'save') {
                const ta = card.querySelector('.reponse-input');
                const txt = ta ? ta.value.trim() : '';
                btn.disabled = true;
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                const payload = { reponse: txt === '' ? null : txt, repondu_le: txt === '' ? null : new Date().toISOString() };
                const r2 = await supabase.from('avis').update(payload).eq('id', id);
                if (r2.error) { toast('Erreur : ' + r2.error.message, true); btn.disabled = false; btn.innerHTML = orig; return; }
                avis.reponse = payload.reponse; avis.repondu_le = payload.repondu_le; delete drafts[id]; renderAll();
                toast(txt === '' ? 'Réponse effacée.' : 'Réponse enregistrée.');
            } else if (action === 'delete') {
                if (!confirm('Supprimer définitivement cet avis ?')) return;
                btn.disabled = true;
                const r3 = await supabase.from('avis').delete().eq('id', id);
                if (r3.error) { toast('Erreur : ' + r3.error.message, true); btn.disabled = false; return; }
                allAvis = allAvis.filter(a => a.id !== id); delete drafts[id]; renderAll(); toast('Avis supprimé.');
            }
        });

        avisList.addEventListener('input', (e) => {
            if (!e.target.classList.contains('reponse-input')) return;
            const card = e.target.closest('.avis-card');
            if (card) drafts[card.dataset.id] = e.target.value;
        });

        filterTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.filter-tab');
            if (!tab) return;
            filterTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.dataset.filter;
            renderList();
        });

        searchInput.addEventListener('input', () => {
            searchTerm = searchInput.value.trim();
            renderList();
        });

        // Auth Logic
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginEmail.value.trim();
            const pwd = loginPassword.value;
            loginBtn.disabled = true; loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
            loginError.style.display = 'none';

            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password: pwd });
                if (error) throw error;
            } catch (err) {
                loginError.textContent = "Identifiants incorrects.";
                loginError.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Se connecter';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => supabase.auth.signOut());
        document.getElementById('refreshBtn').addEventListener('click', () => { loadAvis(); toast("Données actualisées"); });

        if (supabase) {
            supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN') {
                    showDashboard();
                    await loadAvis();
                    subscribeToRealtime();
                    if (Notification.permission === 'default') requestNotifPermission();
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Se connecter';
                } else if (event === 'SIGNED_OUT') {
                    if (channelSubscription) supabase.removeChannel(channelSubscription);
                    showLogin();
                }
            });

            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    showDashboard();
                    loadAvis().then(subscribeToRealtime);
                    if (Notification.permission === 'default') requestNotifPermission();
                } else {
                    showLogin();
                }
            });
        }

    })();
    </script>
</body>
</html>
